<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Liquidation OS — UI directions</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #E5E7EC; font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; color: #0F172A; overflow: hidden; }
  #root { height: 100vh; display: flex; flex-direction: column; }
  .switcher {
    height: 52px; background: #1F1F1F; color: #fff; display: flex; align-items: center;
    gap: 4px; padding: 0 14px; flex-shrink: 0; border-bottom: 1px solid rgba(0,0,0,.2);
  }
  .switcher .brand { font-weight: 700; letter-spacing: 0.3px; font-size: 13px; margin-right: 14px; }
  .switcher .opt {
    border: none; background: transparent; color: rgba(255,255,255,.65); padding: 7px 14px;
    border-radius: 6px; font-family: inherit; font-size: 13px; cursor: pointer; font-weight: 500;
    display: flex; align-items: center; gap: 8px;
  }
  .switcher .opt[data-on="1"] { background: rgba(255,255,255,.12); color: #fff; }
  .switcher .opt .tag {
    font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 3px;
    background: rgba(255,255,255,.14); letter-spacing: 0.4px;
  }
  .switcher .opt[data-on="1"] .tag { background: var(--accent, #0078D4); color: #fff; }
  .stage { flex: 1; min-height: 0; overflow: hidden; position: relative; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="android-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="option-a.jsx"></script>
<script type="text/babel" src="option-b.jsx"></script>
<script type="text/babel" src="option-c.jsx"></script>

<script type="text/babel">
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "accent": "#1E40AF",
    "view": "rows",
    "density": "compact",
    "option": "C"
  }/*EDITMODE-END*/;

  function App() {
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

    const opts = [
      { k: 'A', name: 'Fluent Crisp', desc: 'Standard Win11 Fluent · cool neutrals · #0078D4', defaultAccent: '#0078D4' },
      { k: 'B', name: 'Warehouse Yellow', desc: 'High-contrast utility · safety-yellow accents · mono numbers', defaultAccent: '#F5C518' },
      { k: 'C', name: 'Mica Slate', desc: 'Layered Mica panels · floating nav · slate accent', defaultAccent: '#1E40AF' },
    ];

    React.useEffect(() => {
      const found = opts.find(o => o.k === t.option);
      if (found && t.accent === undefined) setTweak('accent', found.defaultAccent);
    }, []);

    const Comp = { A: OptionA, B: OptionB, C: OptionC }[t.option] || OptionA;

    const switchTo = (k) => {
      const o = opts.find(x => x.k === k);
      setTweak({ option: k, accent: o.defaultAccent });
    };

    return (
      <div data-screen-label={`${t.option} · ${opts.find(o => o.k === t.option).name}`} style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
        <div className="switcher" style={{ '--accent': t.accent }}>
          <span className="brand">LIQUIDATION OS · DESIGN DIRECTIONS</span>
          {opts.map(o => (
            <button key={o.k} className="opt" data-on={t.option === o.k ? '1' : '0'} onClick={() => switchTo(o.k)}>
              <span className="tag">{o.k}</span>
              <span>{o.name}</span>
            </button>
          ))}
          <div style={{ flex: 1 }} />
          <span style={{ fontSize: 11, color: 'rgba(255,255,255,.55)', marginRight: 10 }}>
            {opts.find(o => o.k === t.option).desc}
          </span>
        </div>
        <div className="stage">
          <Comp accent={t.accent} view={t.view} density={t.density} />
        </div>

        <TweaksPanel title="Tweaks">
          <TweakSection label="Direction" />
          <TweakRadio label="Option" value={t.option} options={['A','B','C']} onChange={(v) => switchTo(v)} />

          <TweakSection label="Theme" />
          <TweakColor label="Accent color" value={t.accent} onChange={(v) => setTweak('accent', v)} />

          <TweakSection label="Inventory" />
          <TweakRadio label="Density" value={t.density} options={['compact','comfortable']} onChange={(v) => setTweak('density', v)} />
          <TweakRadio label="View" value={t.view} options={['rows','cards']} onChange={(v) => setTweak('view', v)} />
        </TweaksPanel>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
